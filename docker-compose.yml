services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-poc-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_poc_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_poc_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ai_poc}']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: ai-poc-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
